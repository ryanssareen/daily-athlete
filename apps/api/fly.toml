# Fly.io app config — single-region MVP. Region picked to be near Supabase US.
# Set actual app names + regions before first deploy.

app = "da2-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "production"
  LOG_LEVEL = "info"

[[services]]
  protocol = "tcp"
  internal_port = 8000

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "30s"

  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "get"
    path = "/health"

[processes]
  app = "uv run uvicorn src.main:app --host 0.0.0.0 --port 8000"
  # Uncomment when Phase B jobs land.
  # worker = "uv run arq src.jobs.worker.WorkerSettings"
