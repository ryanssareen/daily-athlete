# Supabase project config.
# https://supabase.com/docs/guides/cli/config

project_id = "da2"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[realtime]
enabled = true

[auth]
enabled = true
# Production URL — also set in Supabase dashboard (URL Configuration).
# Do not `supabase config push` until [auth.external.google] is enabled with secrets,
# or a push can disable Google on the linked remote project.
site_url = "https://da2-one.vercel.app"
additional_redirect_urls = [
  "http://localhost:3000/**",
  "https://da2-one.vercel.app/**",
  "https://da2-*.vercel.app/**",
  "exp://localhost:8081",
  "da2://",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false  # set true in production

[auth.external.apple]
enabled = false  # enable in production

[auth.external.google]
enabled = false  # enable in production
