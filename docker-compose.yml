services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: da2
      POSTGRES_PASSWORD: da2_dev
      POSTGRES_DB: da2
    ports:
      - "54322:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U da2 -d da2"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres_data:
