name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Python)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: da2
          POSTGRES_PASSWORD: da2_dev
          POSTGRES_DB: da2_test
        ports:
          - 54322:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://da2:da2_dev@localhost:54322/da2_test
      DATABASE_URL_SYNC: postgresql://da2:da2_dev@localhost:54322/da2_test
      DATABASE_URL_TEST: postgresql+asyncpg://da2:da2_dev@localhost:54322/da2_test
      DATABASE_URL_TEST_SYNC: postgresql://da2:da2_dev@localhost:54322/da2_test
      REDIS_URL: redis://localhost:6379/0
      SUPABASE_JWT_SECRET: ci-test-secret-do-not-use-in-prod
      STRAVA_TOKEN_KEY: ci-key-32-bytes-of-test-randomness-padding-x
      APP_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.0"

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Sync deps
        working-directory: apps/api
        run: uv sync

      - name: Lint
        working-directory: apps/api
        run: uv run ruff check src tests scripts

      - name: Schema drift check
        working-directory: apps/api
        run: uv run python scripts/check_schema_drift.py

      - name: Tests
        working-directory: apps/api
        run: uv run pytest -v

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter @da2/web typecheck
      - run: pnpm --filter @da2/web lint

  mobile:
    name: Mobile (Expo)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter @da2/mobile typecheck
