name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      # No `version:` here -- pnpm/action-setup reads the version from
      # `packageManager` in package.json (currently pnpm@9.12.0).
      # Specifying both produces ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter @da2/web typecheck
      - run: pnpm --filter @da2/web lint
      # Pure-Zod tests for shared row contracts. No DB needed -- runs here
      # rather than in the Test (apps/web) job to avoid waiting on supabase
      # start for tests that don't need it.
      - run: pnpm --filter @da2/shared typecheck
      - run: pnpm --filter @da2/shared test

  test:
    name: Test (apps/web)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      # No `version:` here -- pnpm/action-setup reads the version from
      # `packageManager` in package.json (currently pnpm@9.12.0).
      # Specifying both produces ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: supabase/setup-cli@v2
        with:
          version: 2.95.4

      - run: pnpm install --frozen-lockfile=false

      # Start the local Supabase stack (Postgres + GoTrue + PostgREST + ...).
      # Migrations under supabase/migrations/ are applied automatically.
      - name: Start Supabase
        run: supabase start

      # Run the tests with the CLI's deterministic local-dev keys in scope.
      # `supabase status -o env` emits shell-escaped `KEY="value"` lines,
      # which $GITHUB_ENV would import literally (with embedded quotes) --
      # breaking URL parsing in supabase-js. `eval` does the unquoting
      # correctly, so we keep the resulting vars scoped to this one step.
      - name: Run tests against local Supabase
        run: |
          eval "$(supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY)"
          export NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY
          pnpm --filter @da2/web test

      # Dump the Supabase containers' logs if tests fail -- supabase CLI has
      # no `logs` subcommand, so go through Docker directly. Helps diagnose
      # migration apply errors or RLS denials from a CI-only repro.
      - name: Supabase container logs on failure
        if: failure()
        run: |
          docker ps --format '{{.Names}}' | grep '^supabase_' | while read name; do
            echo "::group::$name"
            docker logs --tail 200 "$name" || true
            echo "::endgroup::"
          done

  mobile:
    name: Mobile (Flutter)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: daily-athlete
      # --no-fatal-infos: `flutter analyze` fails the step on info-level
      # lints by default, and the tree already carries 19 pre-existing infos
      # (unnecessary_underscores, deprecated_member_use) unrelated to this
      # diff -- without this flag the job goes red on its very first run for
      # reasons this PR didn't introduce, which is exactly the kind of
      # unrelated-failure noise that gets a gate disabled under merge
      # pressure. Real errors/warnings still fail the step.
      - run: flutter analyze --no-fatal-infos
        working-directory: daily-athlete
      - run: flutter test
        working-directory: daily-athlete

  # Apply pending migrations to the production database after tests pass on
  # main. Before this job existed, supabase/migrations/ was only ever applied
  # to the local CI stack -- code merged to main could reference tables that
  # prod didn't have yet (issue #93: /api/weekly-review 500'd with PGRST205
  # because migrations 0019-0023 were never pushed).
  #
  # Auth: SUPABASE_ACCESS_TOKEN repo secret. No DB password needed -- the CLI
  # mints a temporary login role (cli_login_postgres) via the management API
  # and connects through the pooler (the direct db host is IPv6-only, which
  # GitHub runners can't reach). `db push` is a no-op when remote history
  # already matches, so running on every main push is safe and idempotent.
  deploy-migrations:
    name: Deploy migrations (prod)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web, test]
    # Serialize deploys; never cancel a half-applied batch (each migration
    # file runs in its own transaction, so a re-run resumes cleanly).
    concurrency:
      group: deploy-migrations-prod
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v2
        with:
          version: 2.95.4

      - name: Link to production project
        run: supabase link --project-ref gukhwozgnunbqzllobbd

      - name: Show pending migrations
        run: supabase db push --dry-run

      - name: Push migrations
        run: supabase db push --yes
